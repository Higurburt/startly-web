<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Startly — Turn your idea into a real business">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#1A1533"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A99AFF"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A99AFF"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- Top bar: logo + wordmark -->
  <g transform="translate(72 72)">
    <g transform="translate(0 -6)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#0F172A"/>
      <path d="M28 10 l5.36 10.86 11.98 1.74 -8.67 8.45 2.05 11.93 L28 37.3 16.28 43 18.33 31.07 9.66 22.6 21.64 20.87 Z"
            fill="url(#star)" stroke="#0F172A" stroke-width="1.05" stroke-linejoin="round"/>
    </g>
    <text x="76" y="34" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-weight="800" font-size="40" fill="#F8FAFC" letter-spacing="-1.2">Startly</text>
  </g>

  <!-- Badge -->
  <g transform="translate(72 170)">
    <rect x="0" y="0" width="330" height="44" rx="22" fill="#8B7CFF" fill-opacity="0.12" stroke="#8B7CFF" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M24 22 l3.2 6.5 7.17 1.04 -5.19 5.06 1.23 7.14 L24 38.4 17.59 41.75 18.82 34.6 13.63 29.55 20.8 28.51 Z"
          transform="translate(-6 -11) scale(0.8)"
          fill="#A99AFF"/>
    <text x="52" y="29" font-family="JetBrains Mono, Menlo, Consolas, ui-monospace, monospace"
          font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="2.4">FOR YOUNG ENTREPRENEURS</text>
  </g>

  <!-- Headline -->
  <g font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-weight="800" letter-spacing="-3">
    <text x="72" y="300" font-size="82" fill="#F8FAFC">Turn your idea</text>
    <text x="72" y="392" font-size="82" fill="#F8FAFC">into a <tspan fill="url(#gradText)">real business.</tspan></text>
  </g>

  <!-- Subcopy -->
  <text x="72" y="462" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" fill="#CBD5E1" letter-spacing="-0.2">
    AI mentor. Daily tasks. Money tracker.
  </text>
  <text x="72" y="500" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" fill="#CBD5E1" letter-spacing="-0.2">
    From first idea to first sale — in 7 days.
  </text>

  <!-- CTA pill -->
  <g transform="translate(72 540)">
    <rect x="0" y="0" width="360" height="58" rx="29" fill="#A99AFF"/>
    <text x="32" y="38" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif"
          font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.3">Get Started Free</text>
    <path d="M298 29 L322 29 M314 21 L322 29 L314 37" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="444" y="578" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
        font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="2">
    AGES 8–19  ·  NO CARD REQUIRED
  </text>

  <!-- Decorative stats card (right) -->
  <g transform="translate(780 180)">
    <rect x="0" y="0" width="360" height="280" rx="28" fill="#0F172A" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- card header -->
    <text x="26" y="42" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
          font-size="13" font-weight="700" fill="#A99AFF" letter-spacing="2.2">TOTAL MADE</text>
    <!-- big number -->
    <text x="26" y="120" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
          font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-3">$247.50</text>
    <!-- task row -->
    <rect x="26" y="156" width="308" height="52" rx="14" fill="#1E1B3A" stroke="#A99AFF" stroke-opacity="0.4"/>
    <circle cx="50" cy="182" r="10" fill="#A99AFF"/>
    <path d="M45 182 L49 186 L55 178" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="72" y="187" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif"
          font-size="16" font-weight="700" fill="#F8FAFC">Logged first sale</text>
    <text x="260" y="187" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
          font-size="13" font-weight="700" fill="#A99AFF">+30 XP</text>
    <!-- streak -->
    <g transform="translate(26 220)">
      <rect x="0" y="0" width="76" height="40" rx="12" fill="#FF6B9D" fill-opacity="0.12" stroke="#FF6B9D" stroke-opacity="0.4"/>
      <text x="14" y="26" font-size="18">🔥</text>
      <text x="40" y="26" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
            font-size="14" font-weight="800" fill="#FF6B9D">7</text>
    </g>
    <g transform="translate(114 220)">
      <rect x="0" y="0" width="96" height="40" rx="12" fill="#A99AFF" fill-opacity="0.12" stroke="#A99AFF" stroke-opacity="0.4"/>
      <text x="14" y="26" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif"
            font-size="14" font-weight="700" fill="#A99AFF">LVL 2</text>
      <text x="62" y="26" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
            font-size="12" font-weight="700" fill="#F8FAFC">240 XP</text>
    </g>
    <g transform="translate(222 220)">
      <rect x="0" y="0" width="112" height="40" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="14" y="26" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif"
            font-size="14" font-weight="700" fill="#10B981">+37% MARGIN</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="600" y="610" text-anchor="middle"
        font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
        font-size="13" font-weight="600" fill="#64748B" letter-spacing="2">
    higurburt.github.io/startly-web
  </text>
</svg>
