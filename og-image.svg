<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0B1F"/>
      <stop offset="1" stop-color="#1A0F36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A99AFF"/>
      <stop offset="1" stop-color="#FF6B9D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A99AFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A99AFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="900" cy="200" r="380" fill="url(#glow)"/>

  <!-- Star + wordmark -->
  <g transform="translate(80, 80)">
    <path d="M24 4 L29 18 L44 18 L32 28 L37 42 L24 34 L11 42 L16 28 L4 18 L19 18 Z"
          fill="#A99AFF"/>
    <text x="64" y="34" font-family="system-ui, -apple-system, sans-serif"
          font-size="34" font-weight="800" fill="#F5F2FF" letter-spacing="-1">
      Startly
    </text>
  </g>

  <!-- Kicker -->
  <text x="80" y="290" font-family="system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="700" fill="#A99AFF" letter-spacing="4">
    FOR YOUNG ENTREPRENEURS
  </text>

  <!-- Hero phrase -->
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif"
        font-size="84" font-weight="900" fill="#F5F2FF" letter-spacing="-3">
    Turn your idea into a
  </text>
  <text x="80" y="470" font-family="system-ui, -apple-system, sans-serif"
        font-size="84" font-weight="900" fill="url(#accent)" letter-spacing="-3">
    real business.
  </text>

  <!-- Subtitle -->
  <text x="80" y="540" font-family="system-ui, -apple-system, sans-serif"
        font-size="26" font-weight="500" fill="#C7BFE8">
    AI mentor · daily tasks · money tracker
  </text>

  <!-- URL chip -->
  <g transform="translate(80, 564)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#221C42" stroke="#A99AFF" stroke-opacity="0.35"/>
    <text x="120" y="22" font-family="ui-monospace, Menlo, monospace"
          font-size="14" font-weight="600" fill="#C7BFE8" text-anchor="middle" letter-spacing="1">
      startly.app
    </text>
  </g>
</svg>
